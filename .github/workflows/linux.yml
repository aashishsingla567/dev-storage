name: Linux storage safety
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh linux/install.sh linux/install-system.sh linux/configure-t3-limits.sh
      - run: python -m py_compile dev-storage dev_storage_linux.py linux/devbox-run
